server:
  port: 8080

spring:
  application:
    name: Farming-App-Backend
  datasource:
    url: jdbc:postgresql://localhost:5432/farmapp
    username: farmapp
    password: farmapp
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # for dev only; we'll Flyway for prod
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: false # will be enable in prod
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  issuer: yourFarm
  accessTokenTtlMinutes: 30
  refreshTokenTtlDays: 7
  secret: change-this-in-prod

cors:
  allowed-origins: "http://localhost:4200,https://farmapp.com"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump,prometheus
  endpoint:
    health:
      probes:
        enabled: true

